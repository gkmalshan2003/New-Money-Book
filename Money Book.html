<style>
:root{--bg:#F5EBDC;--card:#fff;--tx:#2B1A10;--mu:#8A7260;--ln:#E3D5C0;--ac:#8B5E3C;--ac2:#fff;--gr:#2E7D5B;--rd:#B03A2E;--in:#F5EBDC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-t=dark]{--bg:#000;--card:#161210;--tx:#F5EBDC;--mu:#A8947F;--ln:#3A2E25;--ac:#C9935F;--ac2:#000;--gr:#5CC08F;--rd:#F07A6C;--in:#0B0908}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Roboto,system-ui,sans-serif}
h1,h2,.big{font-family:Georgia,'Noto Serif Sinhala',serif}
main{max-width:640px;margin:auto;padding:18px 16px 110px}
h2{font-size:30px;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.mu{color:var(--mu);font-size:14px}.big{font-size:44px;font-weight:700;margin:4px 0}
.gr{color:var(--gr)}.rd{color:var(--rd)}
input,select,textarea{width:100%;background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:16px;padding:14px;font-size:16px;margin-bottom:10px;font-family:inherit}
button{font-family:inherit;font-size:16px;border-radius:16px;border:1px solid var(--ln);background:var(--in);color:var(--tx);padding:14px;cursor:pointer}
button.p{background:var(--ac);color:var(--ac2);border:0;font-weight:700;width:100%}
button.sq{flex:none;width:48px;padding:12px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}.item:last-child{border:0}
.item .r{display:flex;align-items:center;gap:8px;font-weight:600}
.bar{height:12px;background:var(--ln);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;padding:6px 0;font-size:12px;color:var(--mu)}nav button b{display:block;font-size:22px}
nav button.on{color:var(--ac);font-weight:700}
.empty{color:var(--mu);text-align:center;padding:14px}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block;color:#000;background:#fff;padding:20px;font-family:Georgia,serif}
#pr table{width:100%;border-collapse:collapse;margin:10px 0}#pr td,#pr th{border-bottom:1px solid #ccc;padding:6px;text-align:left}#pr td:last-child,#pr th:last-child{text-align:right}}

const IC=["Salary","Business","Gift","Other"],EC=["Food","Transport","Shopping","Bills","Education","Health","Family","Rent","Fun","Other"];
let D={inc:[],exp:[],goals:[],bills:[],set:{lang:"en",theme:"light"}},tab="home",month="",rc={shop:"",items:[]},armed="";
try{const s=localStorage.getItem("mb2");if(s)D=Object.assign(D,JSON.parse(s))}catch(e){}
let _pt;const save=()=>{D.ts=Date.now();try{localStorage.setItem("mb2",JSON.stringify(D))}catch(e){}clearTimeout(_pt);_pt=setTimeout(()=>push(),800)};
const t=k=>(T[D.set.lang]||T.en)[k]||k;
const e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"Rs. "+Number(n||0).toLocaleString("en-US");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
month=today().slice(0,7);
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sum=a=>a.reduce((x,y)=>x+y.amt,0);
const inM=(a,m)=>a.filter(x=>(x.date||"").slice(0,7)===m);
const val=i=>{const el=document.getElementById(i);return el?el.value.trim():""};
function months(){const s=new Set([today().slice(0,7),month]);[...D.inc,...D.exp,...D.bills.map(b=>({date:b.due}))].forEach(x=>x.date&&s.add(x.date.slice(0,7)));D.goals.forEach(g=>g.dep.forEach(d=>s.add(d.date.slice(0,7))));return[...s].filter(Boolean).sort().reverse()}
const mname=m=>{const[y,mm]=m.split("-");return new Date(y,mm-1,1).toLocaleDateString(D.set.lang==="si"?"si-LK":"en-US",{month:"long",year:"numeric"})};
const stats=m=>{const i=sum(inM(D.inc,m)),x=sum(inM(D.exp,m)),s=D.goals.reduce((a,g)=>a+sum(inM(g.dep,m)),0);return{i,x,s,b:i-x-s}};
function opts(a,sel){return a.map(c=>`<option value="${c}" ${c===sel?"selected":""}>${e(t(c))}</option>`).join("")}
function delBtn(k,fn){return `<button class="sq" onclick="del('${k}',()=>${fn})">${armed===k?"✔":"✕"}</button>`}
function del(k,fn){if(armed===k){armed="";fn();save()}else{armed=k;setTimeout(()=>{if(armed===k){armed="";render()}},2500)}render()}
function entryList(arr,kind,cls){const l=inM(arr,month).sort((a,b)=>b.date.localeCompare(a.date));return l.length?l.map(x=>`<div class="item"><div><div>${e(x.desc||t(x.cat))}</div><div class="mu">${e(t(x.cat))} · ${x.date}</div></div><div class="r ${cls}">${money(x.amt)}${delBtn(x.id,`D.${kind}=D.${kind}.filter(y=>y.id!=='${x.id}')`)}</div></div>`).join(""):`<div class="empty">${t("none")}</div>`}
function entryForm(kind,cats){return `<div class="card"><input id="a" type="number" inputmode="decimal" placeholder="${t("amount")}"><input id="d" placeholder="${t("desc")}"><select id="c">${opts(cats)}</select><input id="dt" type="date" value="${today()}"><button class="p" onclick="addEntry('${kind}')">${t("add")}</button></div>`}
function addEntry(k){const a=parseFloat(val("a"));if(!(a>0))return;const dt=val("dt")||today();D[k].push({id:id(),amt:a,desc:val("d"),cat:val("c"),date:dt});month=dt.slice(0,7);save();render()}
function monthSel(){return `<select onchange="month=this.value;render()">${months().map(m=>`<option value="${m}" ${m===month?"selected":""}>${mname(m)}</option>`).join("")}</select>`}
const V={
home(){const s=stats(month),cats=EC.map(c=>({c,v:sum(inM(D.exp,month).filter(x=>x.cat===c))})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v),ub=D.bills.filter(b=>!b.paid);
return `<div class="row" style="justify-content:flex-start;margin-bottom:14px"><img src="${ICON}" width="56" height="56" style="flex:none;border-radius:14px"><h2 style="margin:0">Money Book</h2></div>${monthSel()}
<div class="card"><div class="mu">${t("bal")}</div><div class="big">${money(s.b)}</div></div>
<div class="row"><div class="card"><div class="mu">${t("ti")}</div><b class="gr">${money(s.i)}</b></div><div class="card"><div class="mu">${t("te")}</div><b class="rd">${money(s.x)}</b></div></div>
<div class="card"><div class="mu">${t("ts")}</div><b>${money(s.s)}</b></div>
${ub.length?`<div class="card"><div class="mu">${t("upb")}</div><b class="rd">${ub.length} · ${money(sum(ub))}</b></div>`:""}
<button class="p" style="margin-bottom:14px" onclick="pdfReport()">📄 ${t("dpdf")}</button><div class="card"><div class="mu">${t("bycat")}</div>${cats.length?cats.map(x=>`<div class="item" style="display:block"><div class="row"><span>${e(t(x.c))}</span><b style="text-align:right">${money(x.v)}</b></div><div class="bar"><i style="width:${Math.round(x.v/s.x*100)}%"></i></div></div>`).join(""):`<div class="empty">${t("none")}</div>`}</div>`},
income(){return `<h2>${t("income")}</h2>${monthSel()}${entryForm("inc",IC)}<div class="card">${entryList(D.inc,"inc","gr")}</div>`},
expenses(){return `<h2>${t("expenses")}</h2>${monthSel()}${entryForm("exp",EC)}<div class="card">${entryList(D.exp,"exp","rd")}</div>`},
savings(){return `<h2>${t("savings")}</h2><div class="card"><input id="gn" placeholder="${t("goal")}"><input id="gt" type="number" inputmode="decimal" placeholder="${t("target")}"><button class="p" onclick="addGoal()">${t("create")}</button></div>`+D.goals.map(g=>{const s=sum(g.dep),p=Math.max(0,Math.min(100,Math.round(s/g.target*100)));return `<div class="card"><div class="row"><b>${e(g.name)}</b>${delBtn(g.id,`D.goals=D.goals.filter(y=>y.id!=='${g.id}')`)}</div><div class="bar"><i style="width:${p}%"></i></div><div class="mu">${money(s)} / ${money(g.target)} · ${p}%</div><div class="row" style="margin-top:10px"><input id="g${g.id}" type="number" inputmode="decimal" placeholder="${t("addph")}" style="margin:0"><button class="p" style="flex:none;width:auto" onclick="dep('${g.id}')">${t("addm")}</button></div></div>`}).join("")},
bills(){return `<h2>${t("bills")}</h2><div class="card"><input id="bn" placeholder="${t("bname")}"><input id="ba" type="number" inputmode="decimal" placeholder="${t("amount")}"><input id="bd" type="date" value="${today()}"><button class="p" onclick="addBill()">${t("add")}</button></div>
<div class="card">${D.bills.length?D.bills.slice().sort((a,b)=>a.due.localeCompare(b.due)).map(b=>`<div class="item"><div><div>${e(b.name)}</div><div class="mu">${b.due} · ${b.paid?t("paid"):t("unpaid")}</div></div><div class="r">${money(b.amt)}${b.paid?"":`<button class="sq" title="${t("mark")}" onclick="pay('${b.id}')">✓</button>`}${delBtn(b.id,`D.bills=D.bills.filter(y=>y.id!=='${b.id}')`)}</div></div>`).join(""):`<div class="empty">${t("none")}</div>`}</div>
<button class="p" style="margin-bottom:14px" onclick="pdfReport()">📄 ${t("dpdf")}</button><div class="row" style="margin-bottom:14px"><button onclick="printBills()">🖨️ ${t("pbills")}</button><button onclick="printReport()">🖨️ ${t("prep")}</button></div><div class="mu" style="margin-bottom:14px">${t("pn")}</div>
<div class="card"><b>${t("rcpt")}</b><input id="rs" placeholder="${t("shop")}" value="${e(rc.shop)}" oninput="rc.shop=this.value" style="margin-top:10px"><input id="ri" placeholder="${t("item")}"><div class="row"><input id="rq" type="number" placeholder="${t("qty")}"><input id="rp" type="number" placeholder="${t("price")}"></div><button style="width:100%;margin-bottom:10px" onclick="addRi()">${t("additem")}</button>
${rc.items.map((x,i)=>`<div class="item"><span>${e(x.n)} × ${x.q}</span><span class="r">${money(x.q*x.p)}<button class="sq" onclick="rc.items.splice(${i},1);render()">✕</button></span></div>`).join("")}
<div class="item"><b>${t("total")}</b><b>${money(rc.items.reduce((a,x)=>a+x.q*x.p,0))}</b></div><button class="p" onclick="printReceipt()">🖨️ ${t("prec")}</button></div>`},
settings(){return `<h2>${t("settings")}</h2><div class="card"><div class="mu">${t("lang")}</div><select onchange="D.set.lang=this.value;save();render()"><option value="en" ${D.set.lang==="en"?"selected":""}>English</option><option value="si" ${D.set.lang==="si"?"selected":""}>සිංහල</option></select><div class="mu">${t("theme")}</div><select onchange="D.set.theme=this.value;save();render()"><option value="light" ${D.set.theme==="light"?"selected":""}>${t("light")}</option><option value="dark" ${D.set.theme==="dark"?"selected":""}>${t("dark")}</option></select></div>
<div class="card"><b>${t("acct")}</b><div class="mu" id="cs" style="margin-top:8px">${cloud.msg||t("cnone")}</div><button style="width:100%;margin-top:10px" onclick="cloudInit()">${t("syncnow")}</button></div><div class="card"><b>${t("back")}</b><textarea id="bk" rows="4" placeholder="${t("pasteph")}" style="margin-top:10px"></textarea><div class="row"><button onclick="copyBk()">${t("copy")}</button><button class="p" onclick="restBk()">${t("rest")}</button></div><div id="msg" class="mu" style="margin-top:8px"></div></div>`}};
function addGoal(){const n=val("gn"),g=parseFloat(val("gt"));if(!n||!(g>0))return;D.goals.push({id:id(),name:n,target:g,dep:[]});save();render()}
function dep(i){const a=parseFloat(val("g"+i));if(!a)return;const g=D.goals.find(x=>x.id===i);if(a<0&&sum(g.dep)+a<0)return;g.dep.push({amt:a,date:today()});save();render()}
function addBill(){const n=val("bn"),a=parseFloat(val("ba"));if(!n||!(a>0))return;D.bills.push({id:id(),name:n,amt:a,due:val("bd")||today(),paid:false});save();render()}
function pay(i){const b=D.bills.find(x=>x.id===i);b.paid=true;D.exp.push({id:id(),amt:b.amt,desc:b.name,cat:"Bills",date:today()});save();render()}
function addRi(){const n=val("ri"),q=parseFloat(val("rq"))||1,p=parseFloat(val("rp"));if(!n||!(p>=0))return;rc.items.push({n,q,p});render()}
function copyBk(){const s=JSON.stringify(D),m=document.getElementById("msg"),b=document.getElementById("bk");b.value=s;b.select();try{navigator.clipboard.writeText(s).then(()=>m.textContent=t("copied"),()=>{})}catch(x){try{document.execCommand("copy");m.textContent=t("copied")}catch(y){}}}
function restBk(){const m=document.getElementById("msg");try{const o=JSON.parse(val("bk"));if(!o.inc||!o.exp)throw 0;D=Object.assign({inc:[],exp:[],goals:[],bills:[],set:D.set},o);save();render()}catch(x){m.textContent=t("bad")}}
function doPrint(h){const p=document.getElementById("pr");p.innerHTML=h;setTimeout(()=>window.print(),100)}
const head=(ti,sub)=>`<div style="display:flex;align-items:center;gap:12px"><img src="${ICON}" width="48" height="48"><div><h1 style="margin:0">${ti}</h1><div>${sub}</div></div></div>`;
function tbl(rows,cols){return `<table><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${e(c)}</td>`).join("")}</tr>`).join("")}</table>`}
function printReport(){const s=stats(month),ci=inM(D.inc,month),ce=inM(D.exp,month);doPrint(head("Money Book — "+t("report"),mname(month))+`<h3>${t("bal")}: ${money(s.b)}</h3><p>${t("ti")}: ${money(s.i)} | ${t("te")}: ${money(s.x)} | ${t("ts")}: ${money(s.s)}</p><h3>${t("income")}</h3>`+tbl(ci.map(x=>[x.date,x.desc||t(x.cat),t(x.cat),money(x.amt)]),[t("date"),t("desc"),"",t("amount")])+`<h3>${t("expenses")}</h3>`+tbl(ce.map(x=>[x.date,x.desc||t(x.cat),t(x.cat),money(x.amt)]),[t("date"),t("desc"),"",t("amount")])+`<h3>${t("savings")}</h3>`+tbl(D.goals.map(g=>[g.name,"",money(g.target),money(sum(g.dep))]),[t("goal"),"",t("target"),t("amount")])+`<h3>${t("bills")}</h3>`+tbl(D.bills.map(b=>[b.due,b.name,b.paid?t("paid"):t("unpaid"),money(b.amt)]),[t("date"),t("bname"),"",t("amount")]))}
function printBills(){doPrint(head(t("bills2"),today())+tbl(D.bills.map(b=>[b.due,b.name,b.paid?t("paid"):t("unpaid"),money(b.amt)]),[t("date"),t("bname"),"",t("amount")])+`<h3>${t("upb")}: ${money(sum(D.bills.filter(b=>!b.paid)))}</h3>`)}
function printReceipt(){if(!rc.items.length)return;doPrint(head(e(rc.shop)||t("rcpt"),today())+tbl(rc.items.map(x=>[x.n,x.q,money(x.p),money(x.q*x.p)]),[t("item"),t("qty"),t("price"),t("amount")])+`<h3 style="text-align:right">${t("total")}: ${money(rc.items.reduce((a,x)=>a+x.q*x.p,0))}</h3>`)}
function render(){document.documentElement.dataset.t=D.set.theme;document.documentElement.lang=D.set.lang;
const ic={home:"🏠",income:"＋",expenses:"－",savings:"🐷",bills:"🧾",settings:"⚙️"};
document.getElementById("nav").innerHTML=Object.keys(ic).map(k=>`<button class="${k===tab?"on":""}" onclick="tab='${k}';armed='';render();scrollTo(0,0)"><b>${ic[k]}</b>${t(k)}</button>`).join("");
const a=document.activeElement&&document.activeElement.id,v=a?document.activeElement.value:null;
document.getElementById("app").innerHTML=V[tab]();}
let cloud={db:null,msg:""};
async function push(){if(!cloud.db)return;try{await cloud.db.set({json:JSON.stringify(D),ts:D.ts||Date.now()});cloud.msg=t("cok")+" "+new Date().toLocaleTimeString()}catch(x){cloud.msg=t("cfail")}const el=document.getElementById("cs");if(el)el.textContent=cloud.msg}
async function cloudInit(){try{if(!window.claude)return;const[db,u]=await Promise.all([claude.use("db"),claude.use("user")]);const uid=u&&await u.id();if(!db||!uid){cloud.msg=t("cnone");render();return}
cloud.db=db.doc("data/users/"+uid+"/book");let s=null;try{s=await cloud.db.get()}catch(x){}
if(s&&s.exists){const d=s.data();if((d.ts||0)>(D.ts||0)){D=Object.assign({inc:[],exp:[],goals:[],bills:[],set:D.set},JSON.parse(d.json));D.ts=d.ts;try{localStorage.setItem("mb2",JSON.stringify(D))}catch(x){}}else await push()}else await push();
cloud.msg=cloud.msg||t("cok");render()}catch(x){cloud.msg=t("cfail");render()}}
async function pdfReport(){let dl=null;try{dl=window.claude&&await claude.use("downloads")}catch(x){}
let html="";const o=doPrint;doPrint=h=>{html=h};printReport();doPrint=o;
if(!dl||!window.html2canvas||!window.jspdf){doPrint(html);return}
const w=document.createElement("div");w.style.cssText="position:fixed;left:-9999px;top:0;width:780px;background:#fff;color:#000;padding:28px;font-family:Georgia,'Noto Serif Sinhala',serif";
w.innerHTML="<style>table{width:100%;border-collapse:collapse;margin:8px 0}td,th{border-bottom:1px solid #ccc;padding:6px;text-align:left}td:last-child,th:last-child{text-align:right}</style>"+html;document.body.appendChild(w);
try{const c=await html2canvas(w,{scale:2,backgroundColor:"#fff"});const pdf=new window.jspdf.jsPDF("p","pt","a4");const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),ih=c.height*pw/c.width;
for(let y=0;y<ih;y+=ph){const sh=Math.min(ph,ih-y)*c.width/pw,s=document.createElement("canvas");s.width=c.width;s.height=Math.ceil(sh);s.getContext("2d").drawImage(c,0,y*c.width/pw,c.width,sh,0,0,c.width,sh);if(y>0)pdf.addPage();pdf.addImage(s.toDataURL("image/jpeg",.92),"JPEG",0,0,pw,sh*pw/c.width)}
await dl.save({filename:"MoneyBook-"+month+".pdf",data:pdf.output("arraybuffer")})}catch(x){}finally{w.remove()}}
render();cloudInit();
</script></body></html>
